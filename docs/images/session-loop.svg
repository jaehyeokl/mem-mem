<svg width="680" height="470" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif" font-size="12">
  <title>One session, from memory injection to the next reflection</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="680" height="470" fill="#ffffff"/>
  <rect x="30" y="30" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="120" y="52" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Teammate's machine</text><text x="120" y="70" text-anchor="middle" fill="#0F6E56">Claude Code / Codex + memmem hooks</text>
  <rect x="250" y="30" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="340" y="52" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">GitHub</text><text x="340" y="70" text-anchor="middle" fill="#5F5E5A">mem-&lt;p&gt; · mem-&lt;p&gt;-transcripts</text>
  <rect x="470" y="30" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="560" y="52" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">server worker + Letta agent</text><text x="560" y="70" text-anchor="middle" fill="#0F6E56">one agent per project</text>
  <g stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"><line x1="120" y1="86" x2="120" y2="450"/><line x1="340" y1="86" x2="340" y2="450"/><line x1="560" y1="86" x2="560" y2="450"/></g>
  <text x="230" y="116" text-anchor="middle" fill="#5F5E5A">① SessionStart: pull mem-&lt;p&gt;, inject its indexes</text><line x1="336" y1="126" x2="124" y2="126" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="40" y="142" width="160" height="44" rx="8" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.5"/><text x="120" y="160" text-anchor="middle" font-weight="500" fill="#444441">the session itself</text><text x="120" y="176" text-anchor="middle" fill="#5F5E5A">the agent reads memory files on demand</text>
  <text x="230" y="216" text-anchor="middle" fill="#5F5E5A">② Stop / PreCompact / SessionEnd: normalize, redact, push</text><line x1="124" y1="226" x2="336" y2="226" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="450" y="256" text-anchor="middle" fill="#5F5E5A">③ worker fetches new transcripts</text><line x1="344" y1="266" x2="556" y2="266" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="480" y="282" width="160" height="74" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="560" y="302" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">④ ingest turn, then reflection</text><text x="560" y="320" text-anchor="middle" fill="#534AB7">Letta rewrites MemFS (git)</text><text x="560" y="338" text-anchor="middle" fill="#534AB7">following the memory's own rules</text>
  <text x="450" y="384" text-anchor="middle" fill="#5F5E5A">⑤ worker pushes MemFS main to mem-&lt;p&gt; and logs to ingest/</text><line x1="556" y1="394" x2="344" y2="394" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="230" y="424" text-anchor="middle" fill="#5F5E5A">⑥ the next session of anyone on the team starts from ①</text><line x1="336" y1="434" x2="124" y2="434" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
