name: release

# Push a tag vX.Y.Z (equal to the "version" in client/package.json and
# packages/server/package.json; both packages release together) to:
#   - build the five client binaries (job `build`),
#   - pack the server tarball memmem-server-X.Y.Z.tgz (job `server-tarball`),
#   - build and push the multi-arch server image to GHCR (job `server-image`),
#   - publish one GitHub Release with all files, the install scripts and a
#     single SHA256SUMS (job `release`, which waits for the other three).
# scripts/install.sh, install.ps1 and install-server.sh download from it.
# memmem-server is not published to the npm registry.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # GHCR namespace of the server image. Change it when the repository moves to
  # an organization (GITHUB_TOKEN can only push to the repository owner's namespace).
  IMAGE_OWNER: jaehyeokl

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-latest, smoke: true }
          - { target: linux-arm64, runner: ubuntu-latest, smoke: false }
          - { target: windows-x64, runner: ubuntu-latest, smoke: false }
          # macOS binaries are built (and ad-hoc signed) on macOS so Gatekeeper accepts them.
          - { target: darwin-arm64, runner: macos-latest, smoke: true }
          - { target: darwin-x64, runner: macos-latest, smoke: false }
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Tag matches client/package.json version
        shell: bash
        run: |
          want="v$(node -p 'require("./package.json").version')"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != $want"; exit 1; }
      - run: npm ci --workspaces=false
      - run: node scripts/embed-assets.mjs --check
      - if: matrix.target == 'linux-x64'
        run: node --test test/*.test.mjs
      - run: node scripts/build-bin.mjs ${{ matrix.target }}
      - if: runner.os == 'macOS'
        run: codesign --force --sign - dist/memmem-${{ matrix.target }}
      - if: matrix.smoke
        run: ./dist/memmem-${{ matrix.target }} --version
      - if: matrix.target == 'linux-x64'
        name: Test suite against the compiled binary
        run: MEMMEM_TEST_BIN=dist/memmem-linux-x64 node --test test/*.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: memmem-${{ matrix.target }}
          path: client/dist/memmem-${{ matrix.target }}*
          if-no-files-found: error

  server-tarball:
    name: server tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24" # >= 24.22, Letta Code's minimum
      - name: Tag matches packages/server/package.json version
        run: |
          want="v$(node -p 'require("./packages/server/package.json").version')"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != $want"; exit 1; }
      # The root .npmrc sets legacy-peer-deps, so Letta Code (a peer) is not installed.
      - run: npm ci
      - run: npm run build
        working-directory: packages/server
      - run: npm test
        working-directory: packages/server
      # memmem-server-X.Y.Z.tgz with its runtime dependencies bundled.
      - run: npm run pack:release -- "$GITHUB_WORKSPACE/out"
        working-directory: packages/server
      - name: Tarball installs and runs
        run: |
          npm i -g --prefix "$RUNNER_TEMP/prefix" --no-audit --no-fund ./out/memmem-server-*.tgz
          [ "$("$RUNNER_TEMP/prefix/bin/memmem-server" version)" = "${GITHUB_REF_NAME#v}" ]
      - uses: actions/upload-artifact@v4
        with:
          name: memmem-server-tarball
          path: out/memmem-server-*.tgz
          if-no-files-found: error

  server-image:
    name: server image (GHCR)
    needs: server-tarball
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The image installs the exact tarball attached to the Release: it
      # replaces the Dockerfile's `pack` stage (COPY --from=pack /out/).
      - uses: actions/download-artifact@v4
        with:
          name: memmem-server-tarball
          path: pack-context/out
      - name: Image name and version
        id: meta
        run: |
          echo "image=ghcr.io/${IMAGE_OWNER}/mem-mem-server" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          build-contexts: pack=pack-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=mem-mem-server
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

  release:
    needs: [build, server-tarball, server-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Client binaries (memmem-*) and the server tarball (memmem-server-*.tgz).
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: |
          cp scripts/install.sh scripts/install.ps1 scripts/install-server.sh out/
          cd out
          chmod +x memmem-linux-* memmem-darwin-*
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/scripts"
          notes=$(printf '%s\n' \
            "Client: curl -fsSL $raw/install.sh | sh" \
            "" \
            "Server (Docker): docker pull ghcr.io/${IMAGE_OWNER}/mem-mem-server:${GITHUB_REF_NAME#v}" \
            "Server (Node >= 24.22): curl -fsSL $raw/install-server.sh | sh -s -- --ref ${GITHUB_REF_NAME}" \
            "" \
            "memmem-server is not on the npm registry; memmem-server-${GITHUB_REF_NAME#v}.tgz below is the package.")
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes" \
            --verify-tag
